<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白酒半年报问答库 · 修订版</title><style>
:root{--ink:#203733;--green:#176753;--paper:#f5f6f2;--line:#d4ddd5;--muted:#66766c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{background:#183e33;color:white;padding:23px 5vw;font-size:19px;font-weight:600}header span{float:right;font-size:13px;font-weight:400;color:#c9dfd1}main{max-width:1170px;margin:auto;padding:40px 35px 70px}h1{font-size:38px;margin:0 0 12px}p{line-height:1.7}.sub{color:var(--muted);margin:0 0 25px}form{display:flex;border:1px solid var(--line);background:#fff;padding:7px;border-radius:8px;gap:8px}input{border:0;flex:1;font-size:17px;min-width:0;padding:13px}button{background:var(--green);color:#fff;border:0;padding:13px 26px;border-radius:5px;font-size:16px;cursor:pointer}button:disabled{opacity:.5}.examples{font-size:13px;display:flex;gap:20px;flex-wrap:wrap;margin:16px 0 30px}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}h2{font-size:23px;margin:0 0 16px}.result{background:#fff;border:1px solid var(--line);padding:25px;margin:22px 0}#answer{white-space:pre-wrap;font-size:16px;line-height:1.8}.meta{font-size:12px;color:var(--muted);margin:13px 0}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{background:#e9eee6;text-align:left}th,td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}td.number{font-variant-numeric:tabular-nums;white-space:nowrap}.evidence{border-top:1px solid var(--line);padding:19px 0}.evidence strong{font-size:16px}.excerpt{white-space:pre-wrap;margin:14px 0;font-size:14px;line-height:1.7;background:#f5f7f2;padding:16px}details{margin:12px 0}summary{cursor:pointer;color:var(--green)}.note{color:#986c1e;background:#fbf7e8;padding:12px;line-height:1.7}.covered{color:var(--green);font-size:13px;line-height:1.8}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}.hidden{display:none}#status{margin:16px 0;color:var(--green)}@media(max-width:700px){main{padding:28px 18px}h1{font-size:29px}header span{float:none;display:block;margin-top:8px}form{display:block}input,button{width:100%}.result{padding:18px}.scroll{overflow:visible}table,tbody,tr,td{display:block;width:100%}thead{display:none}tr{border-bottom:1px solid var(--line);padding:8px 0}td{display:grid;grid-template-columns:135px minmax(0,1fr);gap:8px;padding:6px 0;border:0;overflow-wrap:anywhere}td:before{content:attr(data-label);font-weight:600;color:var(--muted)}td.number{white-space:normal}}
</style></head><body><header>白酒半年报问答库 <span>10家公司 · 2026年半年度报告</span></header><main><h1>先核对财报，再回答问题</h1><p class="sub" id="info">公司、报告期间、单位和原始页码随证据保留</p><form id="form"><input id="q" aria-label="输入财报问题" placeholder="例如：十家公司的营业收入分别是多少？" required><button id="send">提问</button></form><div class="examples"><a href="#" data-q="十家公司的营业收入分别是多少">10家营收全景</a><a href="#" data-q="十家公司的归母净利润分别是多少">10家归母净利润全景</a><a href="#" data-q="古井贡酒2026年上半年研发投入是多少">研发投入口径</a><a href="#" id="showEval">查看10题实际记录</a></div><div id="status"></div><div id="out" class="hidden"><section class="result"><h2 id="question"></h2><div class="meta" id="models"></div><p class="covered" id="coverage"></p><div id="answer"></div><div id="answerCites" class="meta"></div><div class="scroll"><table id="answers" class="hidden"></table></div><div id="limits"></div></section><section class="result"><h2>读过的原文证据</h2><p class="meta">表格保留本期、上期及同比列。页码使用PDF阅读器页码；点击出处可直接回原页。</p><div id="evidence"></div></section></div><section id="evaluations" class="result hidden"><h2>10题实际回答与核对</h2><div id="evalList"></div></section><footer>本地嵌入模型 BGE-small-zh-v1.5 · 向量与BM25融合 · 本地回答模型 Qwen2.5-7B · 仅依据本轮读过的证据</footer></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let latest;
function link(c,label='原报告第'+c.page+'页'){return '<a target="_blank" rel="noopener" href="'+esc(c.url)+'#page='+c.page+'">'+esc(label)+'</a>'}
function display(r){latest=r;$('#out').classList.remove('hidden');$('#evaluations').classList.add('hidden');$('#question').textContent=r.question;$('#models').textContent='BGE-small-zh-v1.5 + BM25 → Qwen2.5-7B · '+r.seconds+'秒 · '+r.evidence.length+'条已读证据';$('#coverage').textContent=r.trace.coverage.map(x=>x.company+'：'+x.status).join('　');$('#answer').innerHTML=esc(r.answer.answer).replace(/\[([^\]]+)\]/g,(s,id)=>{const c=r.evidence.find(x=>x.id===id);return c?'['+link(c,id)+']':s});$('#answerCites').innerHTML='回答引用：'+r.answer.citations.map(id=>{const c=r.evidence.find(x=>x.id===id);return c?link(c,c.company+'第'+c.page+'页'):'无有效引用'}).join('；');const rows=r.answer.rows;$('#answers').classList.toggle('hidden',!rows.length);$('#answers').innerHTML='<thead><tr><th>公司</th><th>指标</th><th>报告期间</th><th>实际回答值</th><th>单位</th><th>出处</th></tr></thead><tbody>'+rows.map(x=>{const c=r.evidence.find(e=>e.id===x.evidence_id);return '<tr><td data-label="公司">'+esc(x.company)+'</td><td data-label="指标">'+esc(x.metric)+'</td><td data-label="报告期间">'+esc(x.period)+'</td><td data-label="实际回答值" class="number">'+esc(x.value)+'</td><td data-label="单位">'+esc(x.unit)+'</td><td data-label="出处">'+(c?link(c):'无有效引用')+'</td></tr>'}).join('')+'</tbody>';$('#limits').innerHTML=r.answer.limitations.length?'<p class="note">'+r.answer.limitations.map(esc).join('<br>')+'</p>':'';$('#evidence').innerHTML=r.evidence.map((c,i)=>'<div class="evidence"><strong>'+esc(c.company)+' · PDF第'+c.page+'页</strong><div class="meta">'+esc(c.section)+' · '+esc(c.id)+'</div>'+ (c.kind==='table'?'<div class="scroll"><table><thead><tr>'+c.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody><tr>'+c.cells.map((v,j)=>'<td data-label="'+esc(c.headers[j])+'">'+esc(v)+'</td>').join('')+'</tr></tbody></table></div><p class="meta">单位：'+esc(c.unit)+'；表名：'+esc(c.table_heading)+'</p>':'<p class="excerpt">'+esc(c.text)+'</p>')+link(c)+' · <a target="_blank" href="/pdf/'+c.code+'.pdf#page='+c.page+'">本地原PDF</a></div>').join('')}
async function ask(){const q=$('#q').value.trim();if(!q)return;$('#send').disabled=true;$('#status').textContent='正在按公司取证，并由本地模型生成答案……';try{const resp=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});const r=await resp.json();if(r.error)throw Error(r.error);display(r);$('#status').textContent='已完成；请结合出处核查口径。'}catch(e){$('#status').textContent='本次请求失败：'+e.message}finally{$('#send').disabled=false}}
$('#form').onsubmit=e=>{e.preventDefault();ask()};document.querySelectorAll('[data-q]').forEach(a=>a.onclick=e=>{e.preventDefault();$('#q').value=a.dataset.q;ask()});$('#showEval').onclick=async e=>{e.preventDefault();const rs=await(await fetch('/api/evaluations')).json();$('#out').classList.add('hidden');$('#evaluations').classList.remove('hidden');$('#evalList').innerHTML=rs.map((r,i)=>'<details><summary>'+ (i+1)+'. '+esc(r.question)+'　'+esc(r.audit?.verdict??'待核对')+'</summary><p>'+esc(r.answer.answer)+'</p><p class="meta">'+esc(r.audit?.reason??'')+'</p><button data-eval="'+i+'">查看这次实际回答和证据</button></details>').join('');document.querySelectorAll('[data-eval]').forEach(b=>b.onclick=()=>{$('#q').value=rs[b.dataset.eval].question;display(rs[b.dataset.eval])})};fetch('/api/info').then(r=>r.json()).then(r=>$('#info').textContent='巨潮资讯原始全文 · '+r.chunks.toLocaleString()+'个正文与表格块 · '+r.dimensions+'维语义向量 + BM25');
</script></body></html>
